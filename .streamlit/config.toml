# "Research desk" light theme: warm paper background, ink-blue accent,
# editorial serif headings over a neutral sans body.
[theme]
base = "light"
primaryColor = "#1F4E79"
backgroundColor = "#FAFAF7"
secondaryBackgroundColor = "#F1EFEA"
textColor = "#1C1F26"
linkColor = "#1F4E79"
borderColor = "#E3E0D8"
codeBackgroundColor = "#F1EFEA"
codeTextColor = "#3A3F4B"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "8px"
linkUnderline = false

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Source Serif 4':https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
headingFontSizes = ["34px", "24px", "19px", "16px", "14px", "12px"]
headingFontWeights = [600, 600, 600, 600, 500, 500]

greenColor = "#1F7A4D"
redColor = "#B4382F"
orangeColor = "#A8620A"
yellowColor = "#B08900"
blueColor = "#1F4E79"
violetColor = "#5B4B8A"
grayColor = "#6B6F78"

chartCategoricalColors = ["#1F4E79", "#C08A3E", "#2E8B7A", "#8C5B7A", "#B4382F", "#6B6F78"]

dataframeBorderColor = "#E3E0D8"
dataframeHeaderBackgroundColor = "#F1EFEA"

[theme.sidebar]
backgroundColor = "#F3F1EC"
secondaryBackgroundColor = "#FFFFFF"
borderColor = "#E3E0D8"

[server]
# Serves ./static at app/static/... (the Ollama setup guide PDF lives there).
enableStaticServing = true
